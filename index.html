<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>貓空集章護照 / 猫空スタンプパスポート</title>
<meta name="description" content="走進貓空六間茶行，完成任務集章，集滿六個章換一盒青農聯名小茶禮盒。">
<meta property="og:title" content="貓空集章護照 / 猫空スタンプパスポート">
<meta property="og:description" content="走一趟山上的茶行，把六個章蓋滿。">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>%F0%9F%8D%B5</text></svg>">
<style>*,*::before,*::after{box-sizing:border-box}body,h1,h2,h3,h4,p,dl,dd,figure{margin:0}button,input{font:inherit;color:inherit}</style>
</head>
<body>
<style>
:root{
  --paper:#E6EBE2; --surface:#F4F7F0; --surface-2:#DCE3D6; --ink:#16261F;
  --ink-soft:#4E6055; --ink-faint:#7C8C82; --rule:#C3CDBC; --tea:#2E6B4E;
  --tea-deep:#1D4633; --tea-wash:#DFE9DF; --seal:#A93B2C; --seal-wash:#F0DED9;
  --gold:#8E7028; --gold-wash:#EFE7D2; --mist:#7E9C97; --bezel:#14261E;
  --on-tea:#F4F7F0; --on-seal:#F6F2EE;

  --serif:"Noto Serif TC","Source Han Serif TC","Songti TC","SimSun","PingFang TC",Georgia,serif;
  --sans:"PingFang TC","Noto Sans TC","Microsoft JhengHei","Hiragino Sans GB",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
}
/* 日文版改用日文字形（漢字字形與中文不同，不能共用） */
:root[lang="ja"]{
  --serif:"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP","Source Han Serif JP","MS PMincho",serif;
  --sans:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","YuGothic","Noto Sans JP","Meiryo",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0B1310; --surface:#131F1A; --surface-2:#1D2C25; --ink:#E3EAE2;
    --ink-soft:#A8BAAE; --ink-faint:#7C8F84; --rule:#2C3F36; --tea:#6FC08F;
    --tea-deep:#A5DDB9; --tea-wash:#1A2C23; --seal:#E4816D; --seal-wash:#31201C;
    --gold:#D3B166; --gold-wash:#2B2417; --mist:#7FA39C; --bezel:#050B08;
    --on-tea:#0B1512; --on-seal:#2A120E;
  }
}
:root[data-theme="dark"]{
  --paper:#0B1310; --surface:#131F1A; --surface-2:#1D2C25; --ink:#E3EAE2;
  --ink-soft:#A8BAAE; --ink-faint:#7C8F84; --rule:#2C3F36; --tea:#6FC08F;
  --tea-deep:#A5DDB9; --tea-wash:#1A2C23; --seal:#E4816D; --seal-wash:#31201C;
  --gold:#D3B166; --gold-wash:#2B2417; --mist:#7FA39C; --bezel:#050B08;
  --on-tea:#0B1512; --on-seal:#2A120E;
}

*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
body{margin:0; background:var(--paper); color:var(--ink); font-family:var(--sans); font-size:15px; line-height:1.75; -webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--serif); font-weight:600; line-height:1.4; margin:0; text-wrap:balance}
p{margin:0}
button{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--tea); outline-offset:2px; border-radius:4px}

.stage{min-height:100dvh; display:grid; place-items:center; position:relative; overflow:hidden}
#guilloche{position:absolute; inset:0; width:100%; height:100%; opacity:.4; pointer-events:none; display:none}
.app{width:100%; height:100dvh; background:var(--surface); display:flex; flex-direction:column; overflow:hidden; position:relative}
.desknote{display:none}
@media(min-width:760px){
  .stage{padding:26px}
  #guilloche{display:block}
  .app{max-width:394px; height:min(824px, calc(100dvh - 52px)); border:11px solid var(--bezel); border-radius:44px;
       box-shadow:0 2px 6px rgba(0,0,0,.16), 0 40px 70px -28px rgba(0,0,0,.5)}
  .desknote{display:block; position:absolute; bottom:18px; left:0; right:0; text-align:center;
    font-family:var(--mono); font-size:10.5px; letter-spacing:.16em; text-transform:uppercase; color:var(--mist)}
}

.top{flex:0 0 auto; display:flex; align-items:center; gap:9px; padding:13px 14px 10px; border-bottom:1px solid var(--rule); background:var(--paper); min-height:52px}
.top.hide{display:none}
.back{background:none; border:0; padding:4px; cursor:pointer; color:var(--ink-soft); display:flex; align-items:center; margin-left:-4px}
.back svg{width:20px; height:20px}
.back[hidden]{display:none}
.top .name{font-family:var(--serif); font-size:.93rem; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.chip{font-family:var(--mono); font-size:10.5px; letter-spacing:.1em; padding:3px 9px; border-radius:999px; background:var(--seal-wash); color:var(--seal); white-space:nowrap; font-variant-numeric:tabular-nums}

/* 語言切換 */
.langsw{display:inline-flex; border:1px solid var(--rule); border-radius:999px; overflow:hidden; background:var(--surface); flex:0 0 auto}
.langsw button{background:none; border:0; cursor:pointer; padding:4px 11px; font-size:.78rem; color:var(--ink-faint); line-height:1.5; white-space:nowrap}
.langsw button[aria-pressed="true"]{background:var(--tea); color:var(--on-tea)}
.langsw.mini button{padding:3px 8px; font-size:.72rem}

.view{flex:1 1 auto; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:18px 16px 26px}
.view::-webkit-scrollbar{width:0}
.pane{display:none; flex-direction:column; gap:16px; animation:rise .3s ease both}
.pane.on{display:flex}
@keyframes rise{from{opacity:0; transform:translateY(8px)}to{opacity:1; transform:none}}
@media(prefers-reduced-motion:reduce){.pane{animation:none}}

.label{font-family:var(--mono); font-size:10px; letter-spacing:.19em; text-transform:uppercase; color:var(--mist)}
.h-lg{font-size:1.5rem; line-height:1.35}
.h-md{font-size:1.16rem}
.sub{font-size:.86rem; color:var(--ink-soft); line-height:1.8}
.tiny{font-size:.75rem; color:var(--ink-faint); line-height:1.7}
.stack{display:flex; flex-direction:column; gap:7px}

.btn{border:1px solid var(--tea); background:var(--tea); color:var(--on-tea); font-size:.94rem; padding:13px 16px;
     border-radius:6px; cursor:pointer; width:100%; text-align:center; transition:filter .15s ease, transform .12s ease}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent; color:var(--tea); border-color:var(--rule)}
.btn.seal{background:var(--seal); border-color:var(--seal); color:var(--on-seal)}

.wel-art{aspect-ratio:5/3; border-radius:8px; background:var(--tea-deep); overflow:hidden; display:grid; place-items:center}
.wel-art svg{width:100%; height:100%; display:block}
.wel-top{display:flex; justify-content:flex-end}
.rules{display:flex; flex-direction:column; border-top:1px solid var(--rule); margin-top:8px}
.rule{display:grid; grid-template-columns:26px 1fr; gap:0 12px; padding:13px 0; border-bottom:1px solid var(--rule); align-items:start}
.rule .n{font-family:var(--mono); font-size:.78rem; color:var(--seal); font-variant-numeric:tabular-nums; padding-top:3px}
.rule h3{font-size:.97rem; margin-bottom:2px}
.rule p{font-size:.83rem; color:var(--ink-soft); line-height:1.75}
.note{background:var(--gold-wash); border-radius:6px; padding:13px 14px; display:flex; flex-direction:column; gap:5px}
.note b{font-size:.85rem; color:var(--gold)}
.note p{font-size:.8rem; color:var(--ink-soft); line-height:1.75}

.rt{border:1px solid var(--rule); border-radius:7px; padding:14px; background:var(--paper); cursor:pointer;
    text-align:left; display:flex; flex-direction:column; gap:6px; width:100%; transition:border-color .15s ease, background .15s ease}
.rt[aria-pressed="true"]{border-color:var(--tea); background:var(--tea-wash)}
.rt .r-top{display:flex; justify-content:space-between; align-items:baseline; gap:10px}
.rt .r-name{font-family:var(--serif); font-size:1.02rem}
.rt .r-meta{font-family:var(--mono); font-size:10px; color:var(--mist); letter-spacing:.07em; white-space:nowrap}
.rt .r-desc{font-size:.8rem; color:var(--ink-soft); line-height:1.7}

.itin{display:flex; flex-direction:column}
.stop{display:grid; grid-template-columns:30px 1fr auto; gap:11px; align-items:center; border:1px solid var(--rule);
      border-radius:7px; padding:12px; background:var(--paper); cursor:pointer; text-align:left; width:100%; transition:border-color .15s ease}
.stop:hover{border-color:var(--tea)}
.stop .idx{width:28px; height:28px; border-radius:50%; border:1px solid var(--rule); display:grid; place-items:center;
           font-family:var(--mono); font-size:11.5px; color:var(--ink-faint)}
.stop.done .idx{background:var(--seal); border-color:var(--seal); color:var(--on-seal)}
.stop .s-name{font-family:var(--serif); font-size:.97rem; display:block}
.stop .s-tag{font-size:.75rem; color:var(--ink-soft); display:block; line-height:1.5}
.stop .s-st{font-family:var(--mono); font-size:9.5px; letter-spacing:.11em; color:var(--mist); white-space:nowrap}
.stop.done .s-st{color:var(--seal)}

.leg{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-left:15px; padding:9px 0 9px 20px; border-left:2px dotted var(--rule)}
.leg .walk{font-size:.76rem; color:var(--ink-faint); display:flex; align-items:center; gap:5px}
.leg .walk svg{width:13px; height:13px; flex:0 0 13px}

.bus{display:inline-flex; align-items:center; gap:7px; border:1px solid var(--rule); background:var(--surface);
     border-radius:999px; padding:3px 10px 3px 4px; cursor:pointer; font-size:.76rem; transition:border-color .15s ease}
.bus:hover{border-color:var(--tea)}
.bus .rno{font-family:var(--mono); font-size:10.5px; background:var(--tea); color:var(--on-tea); border-radius:999px; padding:2px 8px; white-space:nowrap}
.eta{display:inline-flex; align-items:center; gap:5px; color:var(--tea); font-variant-numeric:tabular-nums; white-space:nowrap}
.eta .pulse{width:6px; height:6px; border-radius:50%; background:currentColor; flex:0 0 6px; animation:blip 1.6s ease-in-out infinite}
.eta.soon{color:var(--seal)}
@keyframes blip{0%,100%{opacity:1}50%{opacity:.25}}
@media(prefers-reduced-motion:reduce){.eta .pulse{animation:none}}

.buscard{border:1px solid var(--rule); border-radius:7px; background:var(--paper); overflow:hidden}
.bc-head{display:flex; align-items:center; gap:9px; padding:11px 13px; border-bottom:1px solid var(--rule); background:var(--tea-wash)}
.bc-head .rno{font-family:var(--mono); font-size:12px; background:var(--tea); color:var(--on-tea); border-radius:5px; padding:3px 10px}
.bc-head .dir{font-size:.82rem; color:var(--ink-soft); flex:1}
.bc-body{padding:12px 13px; display:flex; flex-direction:column; gap:10px}
.bc-eta{display:flex; align-items:baseline; gap:9px; color:var(--tea)}
.bc-eta.soon{color:var(--seal)}
.bc-eta .big{font-family:var(--serif); font-size:1.7rem; font-variant-numeric:tabular-nums; line-height:1.1}
.bc-eta .unit{font-size:.82rem; color:var(--ink-soft)}
.bc-next{font-size:.76rem; color:var(--ink-faint); font-variant-numeric:tabular-nums}
.bc-path{display:flex; align-items:center; gap:8px; font-size:.79rem; color:var(--ink-soft)}
.bc-path .dot{width:7px; height:7px; border-radius:50%; border:1.5px solid var(--tea); flex:0 0 7px}
.bc-path .line{flex:1; height:1px; background:var(--rule); position:relative}
.bc-path .line span{position:absolute; top:-8px; left:50%; transform:translateX(-50%); background:var(--paper);
                    padding:0 6px; font-family:var(--mono); font-size:9.5px; color:var(--mist); white-space:nowrap}
.seg{display:flex; flex-direction:column; gap:9px}
.walkcard{border:1px solid var(--rule); border-radius:7px; background:var(--paper); padding:11px 13px;
          display:flex; align-items:center; gap:10px; font-size:.84rem; color:var(--ink-soft)}
.walkcard svg{width:17px; height:17px; flex:0 0 17px; color:var(--mist)}
.walkcard b{color:var(--ink); font-weight:600}

.tag{display:inline-block; font-family:var(--mono); font-size:9.5px; letter-spacing:.14em; text-transform:uppercase;
     color:var(--gold); border:1px solid var(--gold); border-radius:3px; padding:2px 8px}
.mission{border-left:2px solid var(--seal); padding:3px 0 3px 14px; display:flex; flex-direction:column; gap:6px}
.mission p{font-size:.9rem; line-height:1.85}

.codein{width:100%; font-family:var(--mono); font-size:1.6rem; letter-spacing:.3em; text-align:center;
        padding:15px 10px 15px 20px; border:1px solid var(--rule); border-radius:7px; background:var(--paper); color:var(--ink)}
.codein:focus{border-color:var(--tea); outline:none; box-shadow:0 0 0 3px var(--tea-wash)}
.err{color:var(--seal); font-size:.8rem; line-height:1.6; min-height:1.2em}
.orline{display:flex; align-items:center; gap:10px; color:var(--ink-faint); font-family:var(--mono); font-size:.7rem; letter-spacing:.15em}
.orline::before,.orline::after{content:""; flex:1; height:1px; background:var(--rule)}

.stamp-stage{display:grid; place-items:center; padding:12px 0; min-height:190px}
.seal-svg{width:160px; animation:press .55s cubic-bezier(.2,1.5,.4,1) both}
@keyframes press{0%{opacity:0; transform:scale(2.4) rotate(-16deg)}60%{opacity:1; transform:scale(.94) rotate(-7deg)}100%{opacity:1; transform:scale(1) rotate(-7deg)}}
@media(prefers-reduced-motion:reduce){.seal-svg{animation:none; transform:rotate(-7deg)}}
.meter{height:4px; background:var(--surface-2); border-radius:3px; overflow:hidden}
.meter i{display:block; height:100%; background:var(--seal); transition:width .5s ease}

.pp{background:var(--paper); border:1px solid var(--rule); border-radius:8px; padding:15px; display:flex; flex-direction:column; gap:13px}
.pp-head{display:flex; justify-content:space-between; align-items:baseline; border-bottom:1px solid var(--rule); padding-bottom:10px}
.pp-head .t{font-family:var(--serif); font-size:.97rem}
.pp-head .c{font-family:var(--mono); font-size:.82rem; color:var(--seal); font-variant-numeric:tabular-nums}
.cells{display:grid; grid-template-columns:repeat(3,1fr); gap:10px}
.cell{aspect-ratio:1; border:1px dashed var(--rule); border-radius:4px; display:grid; place-items:center;
      background:var(--surface); padding:6px; text-align:center}
.cell.filled{border-style:solid; border-color:var(--seal-wash); background:var(--seal-wash)}
.cell svg{width:100%; height:100%; transform:rotate(-6deg)}
.cell .ghost{font-family:var(--mono); font-size:9.5px; color:var(--ink-faint); line-height:1.45}

.voucher{border:1px solid var(--gold); border-radius:8px; background:var(--paper); padding:18px; display:flex;
         flex-direction:column; gap:11px; align-items:center; text-align:center; position:relative}
.voucher::before,.voucher::after{content:""; position:absolute; width:16px; height:16px; border-radius:50%;
  background:var(--surface); border:1px solid var(--gold); top:50%; transform:translateY(-50%)}
.voucher::before{left:-9px} .voucher::after{right:-9px}
.voucher .vcode{font-family:var(--mono); font-size:1.15rem; letter-spacing:.22em; color:var(--gold)}
.locked{display:flex; flex-direction:column; gap:10px; align-items:center; text-align:center; padding:34px 10px; color:var(--ink-faint)}

/* ══ 店內闖關 ══ */
.qbadge{display:inline-flex; align-items:center; gap:5px; font-family:var(--mono); font-size:9.5px; letter-spacing:.12em;
        text-transform:uppercase; color:var(--seal); border:1px solid var(--seal); border-radius:3px; padding:2px 7px; white-space:nowrap}
.qbadge svg{width:11px; height:11px; flex:0 0 11px}
.stop .s-tag .qbadge{margin-left:6px; vertical-align:1px}

.qhero{border:1px solid var(--seal-wash); background:var(--seal-wash); border-radius:8px; padding:15px;
       display:flex; flex-direction:column; gap:9px}
.qhero .qh-top{display:flex; align-items:center; gap:9px}
.qhero .qh-top svg{width:19px; height:19px; color:var(--seal); flex:0 0 19px}
.qhero h3{font-family:var(--serif); font-size:1.02rem; flex:1}
.qhero p{font-size:.83rem; color:var(--ink-soft); line-height:1.8}

.qsteps{display:flex; flex-direction:column}
.qstep{display:grid; grid-template-columns:26px 1fr; gap:0 12px; padding:12px 0; border-bottom:1px solid var(--rule); align-items:start}
.qstep:first-child{border-top:1px solid var(--rule)}
.qstep .qn{width:24px; height:24px; border-radius:50%; border:1px solid var(--rule); display:grid; place-items:center;
           font-family:var(--mono); font-size:10.5px; color:var(--ink-faint)}
.qstep.done .qn{background:var(--seal); border-color:var(--seal); color:var(--on-seal)}
.qstep.now .qn{border-color:var(--seal); color:var(--seal); border-width:1.5px}
.qstep h4{font-family:var(--serif); font-size:.94rem; font-weight:600; margin-bottom:2px}
.qstep.locked h4,.qstep.locked p{color:var(--ink-faint)}
.qstep p{font-size:.79rem; color:var(--ink-soft); line-height:1.7}
.qstep .qnow{font-family:var(--mono); font-size:9.5px; letter-spacing:.12em; color:var(--seal)}

.qscan{border:1px dashed var(--rule); border-radius:8px; background:var(--paper); padding:22px 16px;
       display:flex; flex-direction:column; align-items:center; gap:12px; text-align:center}
.qscan .frame{width:112px; height:112px; position:relative; display:grid; place-items:center; color:var(--mist)}
.qscan .frame svg{width:52px; height:52px}
.qscan .frame::before,.qscan .frame::after{content:""; position:absolute; width:26px; height:26px; border:2px solid var(--seal); opacity:.75}
.qscan .frame::before{top:0; left:0; border-right:0; border-bottom:0; border-radius:5px 0 0 0}
.qscan .frame::after{bottom:0; right:0; border-left:0; border-top:0; border-radius:0 0 5px 0}
.qscan .where{font-size:.86rem; color:var(--ink); line-height:1.75}
.qscan .where b{color:var(--seal)}

.qcard{border:1px solid var(--rule); border-radius:8px; background:var(--paper); overflow:hidden}
.qcard .qc-art{aspect-ratio:16/7; background:var(--tea-deep); display:grid; place-items:center}
.qcard .qc-art svg{width:56px; height:56px; color:var(--gold)}
/* 有照片的關卡：照片取代插圖，兩張時併排 */
.qcard .qc-art.photo{aspect-ratio:3/2; grid-auto-flow:column; grid-auto-columns:1fr; gap:2px; background:var(--surface-2)}
.qcard .qc-art.photo img{width:100%; height:100%; object-fit:cover; display:block}
.qcard .qc-cap{display:flex; gap:10px; padding:8px 15px 0; flex-wrap:wrap}
.qcard .qc-cap span{font-family:var(--mono); font-size:9.5px; letter-spacing:.08em; color:var(--mist); line-height:1.6}
.qcard .qc-body{padding:15px; display:flex; flex-direction:column; gap:9px}
.qcard .qc-body h3{font-family:var(--serif); font-size:1.1rem}
.qcard .qc-body p{font-size:.87rem; color:var(--ink-soft); line-height:1.9}
.qcard .qc-key{border-top:1px solid var(--rule); padding-top:11px; display:flex; flex-direction:column; gap:4px}
.qcard .qc-key b{font-size:.85rem; color:var(--ink)}

.qtask{border-left:2px solid var(--gold); padding:3px 0 3px 13px; display:flex; flex-direction:column; gap:5px}
.qtask p{font-size:.87rem; line-height:1.85}
.qword{border:1px solid var(--gold); background:var(--gold-wash); border-radius:7px; padding:15px;
       display:flex; flex-direction:column; gap:6px; align-items:center; text-align:center}
.qword .w{font-family:var(--serif); font-size:1.35rem; color:var(--gold); letter-spacing:.14em}
.qprog{display:flex; align-items:center; gap:8px}
.qprog .meter{flex:1}
.qprog .n{font-family:var(--mono); font-size:10.5px; color:var(--seal); font-variant-numeric:tabular-nums}

.tabs{flex:0 0 auto; display:grid; grid-template-columns:repeat(3,1fr); border-top:1px solid var(--rule);
      background:var(--paper); padding-bottom:env(safe-area-inset-bottom)}
.tabs.hide{display:none}
.tab{position:relative; background:none; border:0; cursor:pointer; padding:9px 4px 12px; color:var(--ink-faint);
     display:flex; flex-direction:column; align-items:center; gap:3px; font-size:.71rem; letter-spacing:.05em}
.tab svg{width:20px; height:20px}
.tab[aria-selected="true"]{color:var(--tea)}
.tab .dot{position:absolute; top:7px; left:calc(50% + 9px); width:6px; height:6px; border-radius:50%; background:var(--seal)}
</style>

<div class="stage">
  <canvas id="guilloche" aria-hidden="true"></canvas>
  <div class="app">

    <header class="top hide" id="top">
      <button class="back" id="back" hidden aria-label="返回 / 戻る">

/* ══ 公車到站模擬 ═══════════════════════════ */
const queues = {};
function queueFor(id, headway){
  if (!queues[id]){
    let x = Date.now() + (1 + Math.random()*headway*0.55)*60000;
    const q = [];
    for (let i=0;i<4;i++){ q.push(x); x += (headway*0.75 + Math.random()*headway*0.5)*60000; }
    queues[id] = q;
  }
  const q = queues[id], now = Date.now();
  while (q[0] < now - 40000){ q.shift(); q.push(q[q.length-1] + headway*60000); }
  return q;
}
const etaMins = ts => Math.max(0, Math.round((ts - Date.now())/60000));
const etaText = m => m <= 0 ? t().etaNow : m === 1 ? t().etaSoon : t().etaMin(m);

function etaChip(id, headway){
  const m = etaMins(queueFor(id, headway)[0]);
  return `<span class="eta ${m<=2?'soon':''}" data-eta="${id}" data-headway="${headway}">
    <span class="pulse"></span><span class="etatext">${etaText(m)}</span></span>`;
}
function tickETA(){
  document.querySelectorAll('[data-eta]').forEach(el=>{
    const q = queueFor(el.dataset.eta, +el.dataset.headway), m = etaMins(q[0]);
    el.classList.toggle('soon', m <= 2);
    const a = el.querySelector('.etatext'); if (a) a.textContent = etaText(m);
    const b = el.parentElement.querySelector('[data-eta-next]'); if (b) b.textContent = t().busNext(etaMins(q[1]));
  });
}
setInterval(tickETA, 5000);

                <span class="n">${x.qProgress(qProg[s.id]||0, q.steps.length)}</span>
              </div>
            </div>` : '' }
    ${ on
      ? `<div style="display:flex;align-items:center;gap:13px;background:var(--seal-wash);border-radius:7px;padding:13px">
           <div style="width:54px;flex:0 0 54px">${sealSVG(s)}</div>
           <div><span class="label">${x.doneHere}</span><p class="sub" style="margin-top:2px">${x.doneHereSub}</p></div></div>
         ${ q ? `<button class="btn ghost" data-quest="${s.id}">${x.qReview}</button>` : '' }`
      : q
        ? `<button class="btn seal" data-quest="${s.id}">${(qProg[s.id]||0) ? x.qResume : x.qOpen}</button>
           <button class="btn ghost" data-code="${s.id}">${x.qQuitToCode}</button>`

function fillBus(id){

function fillCode(){
  const x = t(), s = activeShop ? SHOPS.find(v=>v.id===activeShop) : null;
  $('#pCode').innerHTML = `

/* ══ 店內闖關 ═══════════════════════════════ */
function fillQuest(){
  const q = questOf(questShop); if (!q) return;
  const x = t(), s = SHOPS.find(v=>v.id===q.shop), n = q.steps.length, done = qProg[q.shop] || 0;
  const all = done >= n;
  $('#pQuest').innerHTML = `
    <div class="stack">
      <span class="label">${x.qEyebrow} · ${L(s).name}</span>
      <h2 class="h-md">${x.qTitle}</h2>
      <p class="sub">${x.qOverviewSub}</p>
    </div>
    <div class="qprog">
      <div class="meter"><i style="width:${done/n*100}%"></i></div>
      <span class="n">${x.qProgress(done, n)}</span>
    </div>
    <div>
      <span class="label">${x.qStepsLabel}</span>
      <div class="qsteps">
        ${q.steps.map((st,i)=>{
          const cls = i < done ? 'done' : i === done ? 'now' : 'locked';
          const st_ = L(st);
          /* 只有已完成的關卡才顯示標題與內容；進行中的關卡只給線索，位置留給玩家自己找 */
          return `<div class="qstep ${cls}">
            <span class="qn">${i < done ? '✓' : i+1}</span>
            <div>
              <h4>${ i < done ? st_.title : '???' }</h4>
              <p>${ i < done ? st_.task : i === done ? st_.find : x.qLocked }</p>
              ${ i === done && !all ? `<span class="qnow">${x.qNow}</span>` : '' }
            </div></div>`;
        }).join('')}
      </div>
    </div>
    ${ all
      ? `<button class="btn ghost" data-qcard="${n-1}">${x.qReview}</button>
         <button class="btn" data-go="trail">${x.doneBack}</button>`
      : `<button class="btn seal" data-qscan="${done}">${done ? x.qResume : x.qOpen}</button>
         <p class="tiny">${x.qDemoNote}</p>` }`;
}

function fillQScan(i){
  const q = questOf(questShop); if (!q) return;
  const x = t(), st = q.steps[i], d = L(st);
  $('#pQScan').innerHTML = `
    <div class="stack">
      <span class="label">${x.qStepNo(i+1)} · ${x.qProgress(qProg[q.shop]||0, q.steps.length)}</span>
      <h2 class="h-md">${x.qWhere}</h2>
      <p class="sub">${x.qNowHint}</p>
    </div>
    <div class="qscan">
      <div class="frame">${QR}</div>
      <span class="label">${x.qClue}</span>
      <p class="where">${d.find}</p>
    </div>
    <button class="btn seal" id="qScanBtn">${x.qScanBtn}</button>
    <p class="orline">${x.codeOr}</p>
    <div class="stack">
      <p class="tiny">${x.qManual}</p>
      <input class="codein" id="qCodeInput" inputmode="numeric" maxlength="4" placeholder="0000" aria-label="${x.qManual}">
      <p class="err" id="qCodeErr"></p>
      <button class="btn ghost" id="qCodeBtn">${x.qCodeBtn}</button>
    </div>`;
  $('#qScanBtn').onclick = () => { $('#qCodeInput').value = st.code; setTimeout(()=>qUnlock(i, st.code), 300); };
  $('#qCodeBtn').onclick = () => qUnlock(i, $('#qCodeInput').value.trim());
  $('#qCodeInput').addEventListener('keydown', e => { if (e.key === 'Enter') qUnlock(i, $('#qCodeInput').value.trim()); });
}

function qUnlock(i, val){
  const q = questOf(questShop), x = t(), st = q.steps[i], err = $('#qCodeErr');
  if (val.length !== 4){ err.textContent = x.qErrLen; return; }
  if (val !== st.code){
    const later = q.steps.findIndex(v => v.code === val);
    err.textContent = later > i ? x.qErrOrder(later+1) : x.qErrWrong;
    return;
  }
  qProg[q.shop] = Math.max(qProg[q.shop]||0, i+1);
  qCard = i; fillQCard(i); fillQuest();
  history = ['quest'];
  show('qcard', false);
}

function fillQCard(i){
  const q = questOf(questShop); if (!q) return;
  const x = t(), st = q.steps[i], d = L(st), last = i === q.steps.length - 1;
  const shopDone = stamped.has(q.shop);
  const art = st.img
    ? `<div class="qc-art photo">${st.img.map(p=>`<img src="${p.src}" alt="${L(p)}" loading="lazy">`).join('')}</div>
       <div class="qc-cap">${st.img.map(p=>`<span>${L(p)}</span>`).join('')}</div>`
    : `<div class="qc-art">${QART[st.art] || QART.leaf}</div>`;
  $('#pQCard').innerHTML = `
    <div class="qcard">
      ${art}
      <div class="qc-body">
        <span class="label">${x.qStepNo(i+1)}</span>
        <h3>${d.title}</h3>
        <p>${d.body}</p>
      </div>
    </div>
    <div class="qtask"><span class="label">${x.qTask}</span><p>${d.task}</p></div>
    ${ last
      ? `<div class="qword">
           <span class="label">${x.qWordLabel}</span>
           <span class="w">${LANG === 'ja' ? st.wordJa : st.word}</span>
         </div>
         <p class="sub">${x.qFinSub}</p>
         ${ shopDone
            ? `<button class="btn" data-go="trail">${x.doneBack}</button>`
            : `<button class="btn seal" data-qfinish="${q.shop}">${x.qFinishBtn}</button>` }`
      : `<div class="qscan" style="padding:15px 14px">
           <div class="frame" style="width:60px;height:60px">${QR}</div>
           <span class="label">${x.qNext}</span>
           <p class="where">${x.qNextHint}</p>
         </div>
         <button class="btn seal" data-qscan="${i+1}">${x.qNextBtn}</button>` }
    <div class="qprog">
      <div class="meter"><i style="width:${(qProg[q.shop]||0)/q.steps.length*100}%"></i></div>
      <span class="n">${x.qProgress(qProg[q.shop]||0, q.steps.length)}</span>
    </div>`;
}

function fillDone(){
  if (!lastStamp) return;
  const x = t(), s = SHOPS.find(v=>v.id===lastStamp);
  const next = SHOPS.find(v=>!stamped.has(v.id));
  let note = x.doneAll;
  if (next){
    note = next.leg.bus
      ? x.doneNextBus(L(next).name, next.leg.walk, BUS[next.leg.bus.key].no, next.leg.bus.stops)
      : x.doneNextWalk(L(next).name, next.leg.walk);
  }
  $('#pDone').innerHTML = `
    <span class="label">${x.doneEyebrow}</span>
    <div class="stamp-stage">${sealSVG(s, 'seal-svg')}</div>
    <h2 class="h-md">${x.doneTitle(L(s).name)}</h2>
    <p class="sub">${note}</p>
    <div class="meter"><i style="width:${stamped.size/TOTAL*100}%"></i></div>
    <span class="label">${x.doneCount(stamped.size, TOTAL)}</span>
    ${ next ? `<button class="btn ghost" data-stop-go="${next.id}">${x.doneSeeNext}</button>`
            : `<button class="btn ghost" data-go="reward">${x.doneGetGift}</button>` }
    <button class="btn" data-go="trail">${x.doneBack}</button>`;
}

function fillReward(){
  const x = t(), full = stamped.size === TOTAL;

  $('#pReward').innerHTML = !full

      ? `<div class="locked"><h2 class="h-md">${x.rwGotTitle}</h2><p class="sub">${x.rwGotSub}</p></div>`
      : `<span class="label">${x.rwEyebrow}</span>
         <h2 class="h-lg">${x.rwTitle}</h2>

         <button class="btn" id="redeemBtn">${x.rwRedeem}</button>`;
  if (full && !redeemed) $('#redeemBtn').onclick = () => { redeemed = true; fillReward(); fillPassport(); };

      <span class="dot" hidden></span>${x.tabReward}</button>`;
}

/* ══ 導覽 ═══════════════════════════════════ */
const TAB_OF = {trail:'trail', stop:'trail', busview:'trail', code:'trail', done:'trail',
                quest:'trail', qscan:'trail', qcard:'trail', passport:'passport', reward:'reward'};
function chrome(){
  const x = t(), name = cur();
  const showChrome = name !== 'welcome';
  $('#top').classList.toggle('hide', !showChrome);
  $('#tabs').classList.toggle('hide', !showChrome || name === 'routes');
  $('#back').hidden = !['stop','busview','code','routes','quest','qscan','qcard'].includes(name);
  $('#back').setAttribute('aria-label', x.back);
  $('#topChip').textContent = `${stamped.size} / ${TOTAL}`;
  $('#langTop').innerHTML = langSw(true);
  $('#deskNote').textContent = x.deskNote;
  $('#topName').textContent =
    (name === 'stop' || name === 'code') && activeShop ? L(SHOPS.find(s=>s.id===activeShop)).name :
    ['quest','qscan','qcard'].includes(name) && questShop ? `${L(SHOPS.find(s=>s.id===questShop)).name} · ${x.qTitle}` :
    name === 'busview' ? x.busTop : x.appName;
  const tb = TAB_OF[name];
  document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === tb)));
}
function show(name, push=true){
  const c = cur();
  if (push && c && c !== name) history.push(c);
  panes.forEach(p => p.classList.toggle('on', p.dataset.pane === name));
  $('#view').scrollTop = 0;
  chrome(); tickETA();
}

function setLang(l){
  if (l === LANG) return;
  LANG = l;
  try { localStorage.setItem('mk-lang', l); } catch(e){}
  document.documentElement.lang = l;
  renderAll();
}
function renderAll(){
  fillWelcome(); fillRoutes(); fillTrail(); fillPassport(); fillReward(); fillTabs(); fillCode();
  if (activeShop) fillStop(activeShop);
  if (busShop) fillBus(busShop);
  if (questShop){ fillQuest(); fillQScan(Math.min(qProg[questShop]||0, questOf(questShop).steps.length-1)); fillQCard(qCard); }
  if (lastStamp) fillDone();
  chrome();
}

/* ══ 蓋章 ═══════════════════════════════════ */
function doStamp(id){
  stamped.add(id); lastStamp = id;
  fillTrail(); fillPassport(); fillReward(); fillDone();
  if (questShop){ fillQuest(); fillQCard(qCard); }
  history = ['trail'];
  show('done', false);
}
function submitCode(){
  const x = t(), val = $('#codeInput').value.trim(), c = SHOPS.find(v=>v.id===activeShop);
  if (val.length !== 4){ $('#codeErr').textContent = x.errLen; return; }
  if (val === c.code){ doStamp(c.id); return; }
  const other = SHOPS.find(v=>v.code === val);
  $('#codeErr').textContent = other ? x.errOther(L(other).name, L(c).name) : x.errWrong;
}
function openQuest(id){ questShop = id; qCard = Math.max(0, (qProg[id]||1) - 1); fillQuest(); show('quest'); }
function openQScan(i){
  fillQScan(i); show('qscan');
  setTimeout(()=>$('#qCodeInput')?.focus({preventScroll:true}), 80);
}
function openCode(id){
  activeShop = id; fillCode();
  show('code');
  setTimeout(()=>$('#codeInput')?.focus(), 80);
}

/* ══ 事件 ═══════════════════════════════════ */
document.addEventListener('click', e => {
  const lg = e.target.closest('[data-lang]');
  if (lg){ setLang(lg.dataset.lang); return; }

  const go = e.target.closest('[data-go]');
  if (go){ show(go.dataset.go); return; }

  const rt = e.target.closest('[data-route]');
  if (rt){ routePick = +rt.dataset.route;
           document.querySelectorAll('.rt').forEach(b=>b.setAttribute('aria-pressed', String(+b.dataset.route === routePick)));
           return; }

  const bs = e.target.closest('[data-bus]');
  if (bs){ busShop = +bs.dataset.bus; fillBus(busShop); show('busview'); return; }

  const sg = e.target.closest('[data-stop-go]');
  if (sg){ activeShop = +sg.dataset.stopGo; fillStop(activeShop); show('stop'); return; }

  const st = e.target.closest('[data-stop]');
  if (st){ activeShop = +st.dataset.stop; fillStop(activeShop); show('stop'); return; }

  const cd = e.target.closest('[data-code]');
  if (cd){ openCode(+cd.dataset.code); return; }

  const qq = e.target.closest('[data-quest]');
  if (qq){ openQuest(+qq.dataset.quest); return; }

  const qs = e.target.closest('[data-qscan]');
  if (qs){ openQScan(+qs.dataset.qscan); return; }

  const qc = e.target.closest('[data-qcard]');
  if (qc){ qCard = +qc.dataset.qcard; fillQCard(qCard); show('qcard'); return; }

  const qf = e.target.closest('[data-qfinish]');
  if (qf){ const id = +qf.dataset.qfinish; activeShop = id; doStamp(id); return; }

  const tab = e.target.closest('.tab');
  if (tab){ history = []; show(tab.dataset.tab, false); return; }

  const bk = e.target.closest('#back');
  if (bk){ show(history.pop() || 'trail', false); return; }
});

/* ══ 桌面背景紋 ═════════════════════════════ */
(function(){
  const cv = $('#guilloche');
  function paint(){
    if (getComputedStyle(cv).display === 'none') return;
    const host = cv.parentElement, w = host.offsetWidth, h = host.offsetHeight, dpr = Math.min(devicePixelRatio||1, 2);
    cv.width = w*dpr; cv.height = h*dpr;
    const g = cv.getContext('2d'); g.scale(dpr,dpr); g.clearRect(0,0,w,h);
    const cx = w/2, cy = h/2, base = Math.min(w,h)*0.62;
    g.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--mist').trim() || '#7E9C97';
    g.lineWidth = .5;
    for (let ring=0; ring<5; ring++){
      const R = base*(1-ring*0.14), r = R*(0.21+ring*0.035), d = R*(0.52-ring*0.05), k = (R-r)/r;
      g.globalAlpha = 0.26 - ring*0.032; g.beginPath();
      for (let s=0; s<=Math.PI*22; s+=0.012){
        const x = cx + (R-r)*Math.cos(s) + d*Math.cos(k*s);
        const y = cy + (R-r)*Math.sin(s) - d*Math.sin(k*s);
        s===0 ? g.moveTo(x,y) : g.lineTo(x,y);
      }
      g.stroke();
    }
    g.globalAlpha = 1;
  }
  paint();
  let tid; addEventListener('resize', ()=>{ clearTimeout(tid); tid=setTimeout(paint,180); });
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', paint);
})();

/* ══ 啟動 ═══════════════════════════════════ */
document.documentElement.lang = LANG;
renderAll();
show('welcome', false);
</script>
